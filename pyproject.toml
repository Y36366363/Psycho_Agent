[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psycho-agent"
version = "0.15.1"
description = "A provider-neutral conversation orchestration core for human-centered psychological support."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Psycho Agent contributors" }]
dependencies = ["cryptography>=45,<47"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
